name: Refresh Sales Data

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest GHL data
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: node scripts/fetch-data.mjs

      - name: Commit data.json if it changed
        run: |
          git config user.name "sales-ops-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Refresh sales data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No change in data.json -- skipping commit."
          fi
